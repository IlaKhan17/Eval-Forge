name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The acceptance test runs here rather than on every PR: it boots a real server and takes minutes.
  # A merge queue is the right place for "does the loop still work" — the last check before code
  # lands, on the exact combination that will land.
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "0"

jobs:
  # Stage 1 — fast static checks. Ordered first so a lint failure never waits on
  # containers (docs/TESTING_STRATEGY.md §9).
  static:
    name: lint · types · architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy (strict)
        run: uv run mypy
      - name: architectural import contracts
        run: uv run lint-imports --config .importlinter
      - name: application-neutrality check
        run: ./scripts/check-domain-leak.sh

  # Stage 2 — unit tests.
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages
      - name: pytest
        run: >
          uv run pytest
          -m "not integration and not e2e and not load and not live"
          --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  # Stage 3 — integration against real Postgres. Not SQLite: the schema uses
  # JSONB, ARRAY, INET and partial indexes, so a SQLite run would be testing a
  # different database than the one we ship.
  integration:
    name: integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: evalforge
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: evalforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U evalforge"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      POSTGRES_USER: evalforge
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: evalforge
      JWT_SECRET: ci-secret-value-that-is-long-enough-32
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages

      - name: migrations apply, reverse, and reapply
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: models and migrations agree
        # Compares live schema against the ORM metadata. A non-empty diff means
        # someone changed a model without writing the migration for it.
        run: uv run python scripts/check_migration_drift.py

      - run: uv run pytest -m integration

      # Named separately from the suite above, which already runs them, because these two are the
      # ones whose *absence* would be invisible: a route that escapes the tenancy sweep, and a job
      # failure that leaves no record. A named step means the log says which one broke.
      - name: every route is covered by the cross-tenant sweep
        run: uv run pytest apps/api/tests/test_cross_tenant.py -m integration -q

      - name: a failed job leaves a dead letter, and it does not leak
        run: uv run pytest apps/api/tests/test_dead_letters.py -m integration -q

      # The claim the product rests on. Named because a silent divergence between the CLI's exit
      # code and the dashboard's verdict is the one bug that discredits everything else.
      - name: the library and the API reach the same verdict
        run: uv run pytest apps/api/tests/test_parity.py -m integration -q

      # The boundary that keeps a published run trustworthy: a client may supply the metrics the
      # server cannot compute, and may not overwrite the ones it can.
      - name: a run can be published without the client overwriting verified numbers
        run: uv run pytest apps/api/tests/test_publishing.py -m integration -q

      # Deployment posture: secret files, the production refusals, heartbeats, and the metrics an
      # alert reads. Each guards something invisible in normal operation.
      - name: deployment posture holds
        run: uv run pytest apps/api/tests/test_operations.py -m integration -q

      - name: the preflight gate runs
        # Exit 1 is expected here — CI runs as a superuser with no separate migration role, which is
        # exactly what the check exists to refuse. What is being tested is that it *runs* and reports
        # rather than crashing, since a deploy gate that errors gets removed from the pipeline.
        run: |
          uv run python scripts/preflight.py --json > /tmp/preflight.json || true
          python -c "
          import json
          report = json.load(open('/tmp/preflight.json'))
          names = {c['name'] for c in report['checks']}
          assert 'row-level security applies to this role' in names, names
          assert 'partitions cover the current month' in names, names
          print(f\"preflight reported {len(report['checks'])} checks\")
          "

      - name: ingestion degrades rather than closing when object storage fails
        run: |
          uv run pytest apps/api/tests/test_ingest.py -m integration -q \
            -k "GracefulDegradation or ConcurrentFirstBatch"

  # Stage 6 — E2E-1, the MVP acceptance test. Merge queue and main only: it starts a real server in
  # a subprocess and drives the CLI against it, which is minutes rather than seconds. TESTING_STRATEGY
  # §5 calls this the definition of done, so it gates the merge rather than the pull request.
  acceptance:
    name: e2e · the whole loop
    if: github.event_name == 'merge_group' || github.event_name == 'push'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: evalforge
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: evalforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U evalforge"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      POSTGRES_USER: evalforge
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: evalforge
      JWT_SECRET: ci-secret-value-that-is-long-enough-32
      ENV: development
      # No object storage in this job. Payloads under the inline limit never reach a bucket, and the
      # graceful-degradation tests already cover the case where one is unreachable — so the
      # acceptance test exercises the loop rather than MinIO.
      S3_ENDPOINT: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages

      - name: the loop closes — trace, evaluate, exit 0, regress, exit 1, comment
        run: uv run pytest tests/e2e -m e2e -q

      - name: the API log, when it does not
        if: failure()
        run: tail -200 .e2e-api.log || true

  # Stage 4 — the CLI as a user invokes it, including the exit-code contract.
  # A unit test can assert a verdict; only this asserts that CI would act on it.
  cli:
    name: cli contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages

      - name: the load harness runs
        # A single tiny scenario against nothing, purely to catch an import error or a broken
        # argument in a script nobody runs on a PR. Real load runs are nightly and need hardware;
        # see tests/load/README.md for why the committed numbers are advisory.
        run: |
          uv run python -c "
          import tests.load.loadgen as gen
          batch = gen._batch('ci', 0)
          assert len(batch['spans']) == gen.SPANS_PER_BATCH
          assert gen.TARGETS['ingest']['spans_per_second'] == 2000
          print('load harness imports and builds batches')
          "

      - name: publishing degrades to a warning with no server
        # The CLI must gate normally on a machine with no endpoint configured — which is every
        # fork PR, and every developer laptop.
        run: |
          uv run evalforge eval evals/suites/reply-intent.yaml -o /tmp/nopublish.json 2>&1 \
            | tee /tmp/nopublish.log
          grep -q "not published" /tmp/nopublish.log

      - name: suite validates
        run: uv run evalforge validate evals/suites/reply-intent.yaml

      - name: dry run makes no model calls
        run: uv run evalforge eval evals/suites/reply-intent.yaml --dry-run

      - name: a healthy run exits 0
        run: uv run evalforge eval evals/suites/reply-intent.yaml -o /tmp/pass.json

      - name: a protected-metric regression exits 1
        env:
          EXAMPLE_BREAK_UNSUBSCRIBE: "1"
        run: |
          # The gate must block. `!` inverts, so the step fails if the CLI wrongly
          # succeeds — which is the failure mode that matters here.
          ! uv run evalforge eval evals/suites/reply-intent.yaml -o /tmp/fail.json

      - name: the failing report names the blocking gate
        run: |
          uv run python - <<'PY'
          import json, sys
          report = json.load(open("/tmp/fail.json"))
          assert report["verdict"] == "fail", report["verdict"]
          assert report["exit_code"] == 1, report["exit_code"]
          blocking = [g["metric_key"] for g in report["gates"]
                      if g["verdict"] == "fail" and g["blocking"]]
          assert "classes_recall" in blocking, blocking
          print("report contract holds:", blocking)
          PY

  # Stage 3b — the worker's jobs, against the real database. They cannot be unit-tested
  # meaningfully: SKIP LOCKED claiming needs two concurrent transactions, ON CONFLICT
  # idempotency needs the real constraints, and retention needs real partitions.
  online:
    name: online evaluation · review · promotion
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: evalforge
          POSTGRES_PASSWORD: evalforge
          POSTGRES_DB: evalforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_USER: evalforge
      POSTGRES_PASSWORD: evalforge
      POSTGRES_DB: evalforge
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      JWT_SECRET: ci-only-not-a-real-secret
      ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages

      - name: online evaluation, queues, promotion, retention
        run: uv run pytest apps/api/tests/test_online_eval.py -m integration -q

      - name: the worker's configuration loads
        run: |
          # A worker whose settings object is broken fails at deploy time, not in a test,
          # so this asserts the schedule is constructible before anything ships.
          uv run python - <<'PY'
          from evalforge_api.worker.main import WorkerSettings
          names = [f.__name__ for f in WorkerSettings.functions]
          assert names == ["online_eval", "release_leases", "rollup", "retention"], names
          assert len(WorkerSettings.cron_jobs) == 4
          assert WorkerSettings.max_jobs == 1, "these jobs are database-bound; concurrency buys lock contention"
          print("worker schedule:", names)
          PY

  # Stage 3a2 — row-level security. Runs as a deliberately unprivileged role, because the default
  # development role is a superuser and superusers are exempt from every policy: a suite that ran as
  # that role would pass while proving nothing.
  rls:
    name: row-level security · tenant isolation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: evalforge
          POSTGRES_PASSWORD: evalforge
          POSTGRES_DB: evalforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_USER: evalforge
      POSTGRES_PASSWORD: evalforge
      POSTGRES_DB: evalforge
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      JWT_SECRET: ci-only-not-a-real-secret
      ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages

      - name: the database refuses a cross-tenant read and write
        run: uv run pytest apps/api/tests/test_rls.py -m integration -q

      - name: the policy migration round-trips
        run: |
          # Down and up, because the downgrade discovers policies from the catalogue rather than
          # from a code list that can change under it — a mismatch that once left an orphaned
          # policy on api_keys and broke authentication entirely.
          uv run alembic upgrade head
          uv run alembic downgrade -1
          uv run python - <<'PY'
          import asyncio
          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine
          from evalforge_api.settings import get_settings

          async def main():
              engine = create_async_engine(get_settings().sqlalchemy_url)
              async with engine.connect() as conn:
                  count = (await conn.execute(
                      text("SELECT count(*) FROM pg_policy WHERE polname LIKE '%tenant_isolation'")
                  )).scalar_one()
              assert count == 0, f"{count} policies survived the downgrade"
              print("downgrade left no policies behind")
              await engine.dispose()

          asyncio.run(main())
          PY
          uv run alembic upgrade head

      - name: the app role script produces a role RLS applies to
        run: |
          PGPASSWORD=evalforge psql -h 127.0.0.1 -U evalforge -d evalforge \
            -v role_password=ci-only-not-a-real-password -f scripts/create_app_role.sql \
            | tee /tmp/role.txt
          grep -q "rls applies" /tmp/role.txt

  # Stage 3c — the OTLP receiver. The acceptance criterion for this path is a round trip, so
  # it needs the real database: protobuf in, rows out, read back through the trace API.
  otlp:
    name: OTLP receiver · OpenInference mapping
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: evalforge
          POSTGRES_PASSWORD: evalforge
          POSTGRES_DB: evalforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_USER: evalforge
      POSTGRES_PASSWORD: evalforge
      POSTGRES_DB: evalforge
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      JWT_SECRET: ci-only-not-a-real-secret
      ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages

      - name: attribute mapping and wire decoding
        run: uv run pytest apps/api/tests/test_otlp_mapping.py -q

      - name: round trip through the real endpoint
        run: uv run pytest apps/api/tests/test_otlp_receiver.py -m integration -q

      - name: the OpenTelemetry example still runs
        # With no endpoint configured it prints spans instead of exporting, which is enough
        # to catch the example rotting — a broken example is a broken promise, since it is
        # the thing people copy.
        run: uv run python examples/langgraph-agent/agent.py

      - name: the collector config is valid YAML with the pipeline we document
        run: |
          uv run python - <<'PY'
          import yaml
          config = yaml.safe_load(open("infra/otel/collector-config.yaml"))
          pipeline = config["service"]["pipelines"]["traces"]
          assert pipeline["exporters"] == ["otlphttp/evalforge"], pipeline
          # Scrubbing must come before sampling, or secrets survive in whatever the sampler
          # kept. Asserted because it is an ordering nobody notices when it is wrong.
          processors = pipeline["processors"]
          assert processors.index("attributes/scrub") < processors.index("probabilistic_sampler")
          endpoint = config["exporters"]["otlphttp/evalforge"]["endpoint"]
          # The exporter appends /v1/traces itself; an endpoint that already ends in it would
          # produce /v1/traces/v1/traces and a 404 on every export.
          assert endpoint.endswith("/v1/otlp"), endpoint
          print("collector pipeline:", processors)
          PY

  # Stage 4b — calibration. Runs offline from recorded judge verdicts, so it needs no
  # provider credential and works on a fork pull request. That is the point: if this
  # could not run without a secret, `require_calibration` would be untestable in exactly
  # the situation it matters most.
  calibration:
    name: judge calibration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages

      - name: the calibration suite validates
        run: uv run evalforge validate evals/suites/reply-tone.yaml

      - name: recomputing the committed record reproduces it
        run: |
          uv run evalforge calibrate evals/suites/reply-tone.yaml \
            -e acceptable_to_followup \
            --verdicts evals/calibration/reply-tone.verdicts.jsonl \
            --no-write -o /tmp/calibration.json

          # The numbers are hand-checkable from the fixture, so pinning them here catches
          # a change in the maths rather than merely a change in the output format.
          uv run python - <<'PY'
          import json
          report = json.load(open("/tmp/calibration.json"))
          assert report["n_examples"] == 120, report["n_examples"]
          assert abs(report["agreement"] - 112 / 120) < 1e-9, report["agreement"]
          assert abs(report["kappa"] - 0.8666666666666667) < 1e-9, report["kappa"]
          assert abs(report["false_pass_rate"] - 2 / 60) < 1e-9, report["false_pass_rate"]
          assert abs(report["false_fail_rate"] - 6 / 60) < 1e-9, report["false_fail_rate"]
          assert report["n_ceiling_examples"] == 24, report["n_ceiling_examples"]
          print("calibration maths holds")
          PY

      - name: a judge that wanders outside its requirement exits 1
        run: |
          # Rewrite the verdicts so the judge waves through a fifth of the opt-out
          # requests, then assert the command fails. `!` inverts, so the step fails if the
          # CLI wrongly succeeds — which is the failure mode that matters here.
          uv run python - <<'PY'
          import json
          rows = [json.loads(line) for line in open("evals/calibration/reply-tone.verdicts.jsonl")]
          waved = 0
          for row in rows:
              if row["id"].startswith("tone-u") and waved < 12:
                  row["label"] = "acceptable"
                  waved += 1
          with open("/tmp/bad-verdicts.jsonl", "w") as fh:
              for row in rows:
                  fh.write(json.dumps(row) + "\n")
          PY

          ! uv run evalforge calibrate evals/suites/reply-tone.yaml \
              -e acceptable_to_followup --verdicts /tmp/bad-verdicts.jsonl --no-write

      - name: an uncalibrated gated judge is never silent
        run: |
          uv run python - <<'PY'
          import shutil, tempfile
          from pathlib import Path
          from evalforge_cli.runner import build_gate_set, judge_metric_keys, resolve_calibrations
          from evalforge_cli.suite.loader import load_suite
          from evalforge_core.gates import evaluate_gates
          from evalforge_types import Metric, Verdict

          # Hide the committed record, leaving the judge uncalibrated.
          record = next(Path("evals/calibration").glob("*.calibration.json"))
          moved = Path(tempfile.mkdtemp()) / record.name
          shutil.move(record, moved)
          try:
              loaded = load_suite("evals/suites/reply-tone.yaml")
              report = evaluate_gates(
                  build_gate_set(loaded),
                  [Metric(key="acceptable_to_followup", value=0.99, count=120)],
                  judge_metrics=judge_metric_keys(loaded),
                  calibrations=resolve_calibrations(loaded),
              )
              # The metric passes its threshold with room to spare, and the run still
              # fails: `require: true` means an unvalidated judge cannot gate a merge.
              assert report.verdict is Verdict.ERROR, report.verdict
              assert report.blocking_failures[0].rule == "uncalibrated_judge"
              print("uncalibrated judge blocks:", report.blocking_failures[0].message[:70])
          finally:
              shutil.move(moved, record)
          PY

  # Stage 4c — the reference integrations. Ten suites across two unrelated domains, run against
  # committed fixtures with a stub judge, so no provider credential is involved.
  #
  # The job's real assertion is not that the suites pass. It is that each one *fails* when its
  # defect is injected: a suite whose gates cannot fire gives false assurance, which is worse than
  # having no suite.
  reference:
    name: reference suites · Davis & AdaptQuiz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages

      - name: every suite validates and plans for free
        run: uv run pytest packages/cli/tests/test_reference_suites.py -q -m "not slow"

      - name: a clean run passes and every injected regression is caught
        run: uv run pytest packages/cli/tests/test_reference_suites.py -q -m slow

      - name: the fixtures and calibration sets regenerate byte-identically
        run: |
          # A generated fixture that is not reproducible is a fixture whose numbers move under
          # you, and the whole value of a golden dataset is that they do not.
          uv run python scripts/gen_reference_fixtures.py
          uv run python scripts/gen_calibration_sets.py
          git diff --exit-code -- evals/fixtures evals/calibration

      - name: no domain term leaked into the platform
        # The control, rather than discipline. If "davis" or "adaptquiz" ever appears under apps/
        # or packages/, the reference integrations have stopped being examples.
        run: ./scripts/check-domain-leak.sh

      - name: every gated judge is calibrated
        run: |
          # `require_calibration: true` on the judge suites means this is already enforced by the
          # gates above. Asserted separately so the *reason* the records are committed is explicit:
          # they are the evidence CI reads, not documentation.
          uv run python - <<'PY'
          from pathlib import Path
          records = sorted(p.name for p in Path("evals/calibration").glob("*.calibration.json"))
          judges = {
              "claim_groundedness",
              "grounded_personalization",
              "summary_factuality",
              "citation_support",
              "next_question_relevance",
              "acceptable_to_followup",
          }
          covered = {name.split(".")[0] for name in records}
          missing = judges - covered
          assert not missing, f"judges with no committed calibration: {sorted(missing)}"
          print(f"{len(records)} calibration record(s) committed")
          PY

  # Stage 5 — the dashboard. Its own job rather than steps appended to `static`:
  # nothing here needs Python, and a Node failure should be readable without
  # scrolling past a uv sync.
  web:
    name: dashboard · lint · types · tests · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # `--frozen-lockfile` so a lockfile that does not match package.json fails here
      # rather than silently resolving to different versions than anyone tested.
      - name: install
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: biome (lint and format)
        run: pnpm lint

      - name: tsc --noEmit
        run: pnpm typecheck

      - name: vitest
        run: pnpm test

      # Last, because it is the slowest and because a type error should be reported by
      # the step named after types.
      - name: next build
        run: pnpm build
        env:
          # The build must not require a live API or a real credential. If it ever
          # does, that means a page is fetching at build time, which would also mean
          # a stale dashboard in production.
          EVALFORGE_API_URL: http://127.0.0.1:8000
          EVALFORGE_API_KEY: ef_dev_00000000_ci-build-placeholder-not-a-real-key
