name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "0"

jobs:
  # Stage 1 — fast static checks. Ordered first so a lint failure never waits on
  # containers (docs/TESTING_STRATEGY.md §9).
  static:
    name: lint · types · architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy (strict)
        run: uv run mypy
      - name: architectural import contracts
        run: uv run lint-imports --config .importlinter
      - name: application-neutrality check
        run: ./scripts/check-domain-leak.sh

  # Stage 2 — unit tests.
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages
      - name: pytest
        run: >
          uv run pytest
          -m "not integration and not e2e and not load and not live"
          --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  # Stage 3 — integration against real Postgres. Not SQLite: the schema uses
  # JSONB, ARRAY, INET and partial indexes, so a SQLite run would be testing a
  # different database than the one we ship.
  integration:
    name: integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: evalforge
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: evalforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U evalforge"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      POSTGRES_USER: evalforge
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: evalforge
      JWT_SECRET: ci-secret-value-that-is-long-enough-32
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages

      - name: migrations apply, reverse, and reapply
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: models and migrations agree
        # Compares live schema against the ORM metadata. A non-empty diff means
        # someone changed a model without writing the migration for it.
        run: uv run python scripts/check_migration_drift.py

      - run: uv run pytest -m integration

  # Stage 4 — the CLI as a user invokes it, including the exit-code contract.
  # A unit test can assert a verdict; only this asserts that CI would act on it.
  cli:
    name: cli contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages

      - name: suite validates
        run: uv run evalforge validate evals/suites/reply-intent.yaml

      - name: dry run makes no model calls
        run: uv run evalforge eval evals/suites/reply-intent.yaml --dry-run

      - name: a healthy run exits 0
        run: uv run evalforge eval evals/suites/reply-intent.yaml -o /tmp/pass.json

      - name: a protected-metric regression exits 1
        env:
          EXAMPLE_BREAK_UNSUBSCRIBE: "1"
        run: |
          # The gate must block. `!` inverts, so the step fails if the CLI wrongly
          # succeeds — which is the failure mode that matters here.
          ! uv run evalforge eval evals/suites/reply-intent.yaml -o /tmp/fail.json

      - name: the failing report names the blocking gate
        run: |
          uv run python - <<'PY'
          import json, sys
          report = json.load(open("/tmp/fail.json"))
          assert report["verdict"] == "fail", report["verdict"]
          assert report["exit_code"] == 1, report["exit_code"]
          blocking = [g["metric_key"] for g in report["gates"]
                      if g["verdict"] == "fail" and g["blocking"]]
          assert "classes_recall" in blocking, blocking
          print("report contract holds:", blocking)
          PY
