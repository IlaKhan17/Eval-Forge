[project]
name = "evalforge-workspace"
version = "0.0.0"
description = "EvalForge monorepo root (not published)"
requires-python = ">=3.12,<3.14"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
# apps/api carries both the API and the worker: same package, same image, two
# entrypoints (ADR-001). apps/worker holds only deployment config, not code.
members = ["packages/*", "apps/api"]

[tool.uv.sources]
evalforge-types = { workspace = true }
evalforge-core = { workspace = true }
evalforge-trajectory = { workspace = true }
evalforge = { workspace = true }
evalforge-cli = { workspace = true }

[dependency-groups]
dev = [
    "evalforge-types",
    "evalforge-core",
    "evalforge-trajectory",
    "evalforge",
    "evalforge-cli",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "hypothesis>=6.112",
    "syrupy>=4.8",
    "freezegun>=1.5",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "types-pyyaml>=6.0.12.20260724",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp-proto-http>=1.29",
]

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["packages", "apps", "tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
asyncio_mode = "auto"
markers = [
    "integration: requires docker services (postgres/redis/minio)",
    "e2e: full-stack end-to-end test",
    "load: performance test, not run in PR CI",
    "live: calls a real model provider; never run in PR CI",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["packages"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

# ---------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = ["redundant-expr", "possibly-undefined", "truthy-bool"]
files = ["packages", "apps"]
# Two packages each have a tests/conftest.py, and mypy cannot hold two modules with
# the same name. The conftest files are fixtures, not shipped code; everything else
# under tests/ is still checked.
exclude = "(^|/)conftest\\.py$"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# Each package has its own tests/conftest.py, so the module name collides and mypy
# cannot hold both. Fixtures are test scaffolding, not shipped code; the tests that
# import from them are still fully checked.
# boto3 ships no type information. Only the thin S3ObjectStore adapter touches it,
# and that adapter is behind the ObjectStore protocol, which *is* typed.
[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

# The generated protobuf modules and google.protobuf ship no usable stubs. Confined to
# evalforge_api.otlp.decode, which converts them to plain dataclasses immediately — so no
# untyped value escapes into the mapping or the ingest path.
[[tool.mypy.overrides]]
module = ["google.protobuf.*", "opentelemetry.proto.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "conftest"
ignore_missing_imports = true
follow_imports = "skip"
