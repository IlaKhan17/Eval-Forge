apiVersion: apps/v1
kind: Deployment
metadata:
  name: proofstep-api
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: proofstep-api}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels: {app.kubernetes.io/name: proofstep-api}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      # Spread across nodes where possible. `ScheduleAnyway`, not `DoNotSchedule`: on a single-node
      # cluster the strict version leaves the second replica Pending forever, which is a worse
      # failure than two pods sharing a node.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: proofstep-api}
      containers:
        - name: api
          image: ghcr.io/ilakhan17/proofstep/api
          args: ["api"]
          ports:
            - {name: http, containerPort: 8000}
          envFrom:
            - configMapRef: {name: proofstep-config}
          env:
            # The application role. No MIGRATION_DATABASE_URL here: this pod issues no DDL, and the
            # owner's credential has no business in the process facing the internet.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: proofstep-secrets, key: database-url}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: {name: proofstep-secrets, key: jwt-secret}
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: proofstep-secrets, key: s3-secret-key}
          # Three probes, three different questions.
          #
          # `startupProbe` covers the slow first moments — connection pools, partition checks — so
          # the liveness probe's short period does not kill a pod that is merely still starting.
          startupProbe:
            httpGet: {path: /healthz, port: http}
            failureThreshold: 30
            periodSeconds: 2
          # Liveness asks "is this process wedged", so it hits /healthz, which touches nothing
          # external. Pointing it at /readyz would mean a database blip restarts every API pod —
          # turning a recoverable dependency outage into a self-inflicted one.
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          # Readiness is the one that asks about dependencies, because "should traffic come here"
          # genuinely depends on them. /readyz also reports whether row-level security is enforced.
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            # No CPU limit, deliberately: the CFS quota throttles a latency-sensitive service at the
            # exact moment it is busiest, and the request already guarantees a share. Memory is
            # limited, because the failure mode there is eviction of an innocent neighbour.
            limits: {memory: 1Gi}
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: proofstep-api
spec:
  selector: {app.kubernetes.io/name: proofstep-api}
  ports:
    - {name: http, port: 8000, targetPort: http}
---
# Keeps a drain or an upgrade from taking every replica at once.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: proofstep-api
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: proofstep-api}
