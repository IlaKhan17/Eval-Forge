# The dashboard. Next.js in standalone mode, serving the browser and proxying the browser's calls to
# the API with the caller's own session attached.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proofstep-web
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: proofstep-web}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels: {app.kubernetes.io/name: proofstep-web}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: web
          image: ghcr.io/ilakhan17/proofstep/web
          ports:
            - {name: http, containerPort: 3000}
          env:
            # In-cluster, over the Service. The dashboard is the only thing that needs to reach the
            # API this way, and it never leaves the cluster to do it.
            - name: PROOFSTEP_API_URL
              value: http://proofstep-api:8000
            - name: NODE_ENV
              value: production
          # No dependency check: the dashboard renders a login page whether or not the API is
          # reachable, and taking it out of rotation when the API is down replaces a useful error
          # message with a 502 from the ingress controller.
          livenessProbe:
            httpGet: {path: /login, port: http}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /login, port: http}
            periodSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: proofstep-web
spec:
  selector: {app.kubernetes.io/name: proofstep-web}
  ports:
    - {name: http, port: 3000, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: proofstep-web
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: proofstep-web}
