# Schema migrations and application-role provisioning, as a Job.
#
# Not an init container on the API Deployment, which is the tempting shortcut: an init container runs
# once per pod, so three replicas mean three concurrent `alembic upgrade head` against the same
# database. Alembic takes a lock and the losers block, which looks like a slow rollout until the day
# it looks like a deadlock.
#
# This is also the only pod that receives the owning role's credential. Everything else runs as a
# role that cannot create a table — because a role that can create a table can create one with no
# row-level-security policy, and RLS is the isolation boundary between tenants.
apiVersion: batch/v1
kind: Job
metadata:
  name: proofstep-migrate
  annotations:
    # Ordering, if you use Argo CD. Without a sync-wave the Deployments and this Job apply together
    # and the pods crash-loop until it finishes — recoverable, and noisy enough to look like an
    # outage during every deploy.
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook: Sync
spec:
  # A failed migration is not something to retry blindly; the second attempt usually fails the same
  # way and the third obscures which one was the real error.
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: proofstep-migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: migrate
          image: ghcr.io/ilakhan17/proofstep/api
          args: ["migrate"]
          envFrom:
            - configMapRef:
                name: proofstep-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: proofstep-secrets, key: database-url}
            # The owner. Only here.
            - name: MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: proofstep-secrets, key: migration-database-url}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: {name: proofstep-secrets, key: jwt-secret}
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: proofstep-secrets, key: s3-secret-key}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
