# Prometheus alert rules for Proofstep.
#
#   rule_files: [/etc/prometheus/proofstep.rules.yml]
#
# and a scrape job — the metrics endpoint requires a bearer token, because adding an unauthenticated
# surface to a service whose whole threat model is "who may read what" is not a trade worth making
# for the convenience of one scraper:
#
#   scrape_configs:
#     - job_name: proofstep
#       metrics_path: /metrics
#       authorization:
#         type: Bearer
#         credentials_file: /etc/prometheus/proofstep.token   # a key with the `read` scope
#       static_configs:
#         - targets: ["proofstep-api:8000"]
#
# Every alert here fires on a failure that is **silent** — one where the API keeps answering 200 and
# the only symptom is that something gradually stops happening. Alerts for things that already page
# you (5xx rates, container restarts, disk) belong in your platform's own rules; duplicating them
# here would mean two definitions drifting apart.

groups:
  - name: proofstep
    rules:
      # ---------------------------------------------------------------- the worker

      - alert: ProofstepWorkerStopped
        # The single most important alert in this file. When the worker stops, online evaluation,
        # review-queue escalation, lease recovery, and retention all stop with it, and *nothing*
        # else changes: the API is healthy, ingestion works, the dashboard renders. The only
        # symptom is that new evaluations stop appearing, which looks exactly like a quiet week.
        expr: max(proofstep_worker_heartbeat_age_seconds) > 300
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "No worker heartbeat for {{ $value | humanizeDuration }}"
          description: >
            Background jobs are not running. Online evaluations stop being written, review queues
            stop filling, and retention stops. Check the worker process and
            GET /v1/ops/queues.

      - alert: ProofstepNoWorkerRegistered
        # `absent()` rather than a threshold: a worker that has never beaten produces no sample at
        # all, and a rule that only compares ages would stay silent forever on a deployment whose
        # worker never started.
        expr: absent(proofstep_worker_heartbeat_age_seconds) or proofstep_workers_known == 0
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: "No worker has ever reported in"
          description: >
            Either the worker was never started, or it cannot reach the database. A deployment
            with an API and no worker looks completely healthy from the outside.

      # ---------------------------------------------------------------- the queues

      - alert: ProofstepQueueUnreachable
        # Distinct from "the queue is empty". Depth 0 and "I cannot see the queue" look identical
        # in a number and mean opposite things, which is why the exporter reports reachability
        # separately rather than exporting 0 on failure.
        expr: proofstep_job_queue_reachable == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "The job queue cannot be read"
          description: "Redis is unreachable from the API. Jobs are probably not being processed."

      - alert: ProofstepQueueBacklog
        # `depth - scheduled`: cron jobs sit in the same sorted set with a future score, so counting
        # them as backlog would alert on a healthy schedule every single minute.
        expr: (proofstep_job_queue_depth - proofstep_job_queue_scheduled) > 100
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} jobs waiting to run"
          description: >
            The worker is not keeping up. One worker with max_jobs=1 is the default; this is the
            signal that the deployment has outgrown it.

      # ------------------------------------------------------------- dead letters

      - alert: ProofstepDeadLetters
        expr: proofstep_dead_letters_unresolved > 0
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} background job(s) failed every retry"
          description: >
            See GET /v1/ops/dead-letters. Each row names the job, the exception type, and a
            truncated message; the full traceback is in the worker's log.

      - alert: ProofstepDeadLettersUnattended
        # Age, not count. One failure this morning is an incident; one unresolved for three days
        # means nobody is reading the first alert, which is a different problem with a different fix.
        expr: proofstep_dead_letters_oldest_age_seconds > 259200
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "A job failure has gone unhandled for three days"
          description: "Resolve it via POST /v1/ops/dead-letters/{id}/resolve, with a note."

      # ------------------------------------------------------------ review queues

      - alert: ProofstepReviewQueueStale
        # A review queue is a control only while someone reads it. Depth alone cannot distinguish a
        # busy day from an abandoned queue; the age of the oldest pending item can.
        expr: proofstep_review_queue_oldest_age_seconds > 604800
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "Review queue {{ $labels.queue }} has an item a week old"
          description: >
            Items are being escalated and not reviewed. A queue nobody reads stops being a control
            while still looking like one on a dashboard.

      # ------------------------------------------------------------------- budget

      - alert: ProofstepBudgetExhausted
        # Not an error — the ceiling did its job. It pages because the *consequence* is silent: paid
        # rules stop, the free ones carry on, and the dashboard keeps filling with traces that
        # simply are not being judged any more.
        expr: proofstep_project_budget_exhausted == 1
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "The monthly spend ceiling is reached; paid rules are being skipped"
          description: >
            Deterministic rules keep running. Judged coverage stops until the month turns or the
            limit rises — see GET /v1/ops/budget, and the `budget` decision reason on skipped
            evaluations.

      - alert: ProofstepBudgetNearlySpent
        expr: proofstep_project_spend_ratio > 0.8
        for: 30m
        labels: {severity: info}
        annotations:
          summary: "{{ $value | humanizePercentage }} of the monthly ceiling is used"
          description: "Raise the limit or turn a sampled judge rule down before coverage stops."

      # ------------------------------------------------------------------ tenancy

      - alert: ProofstepTenantIsolationNotEnforced
        # Deliberately included even though it cannot change without a deploy. This is the one
        # security property that is invisible in behaviour — every query returns the right rows
        # either way — so the only way it gets noticed is if something says so out loud.
        expr: proofstep_rls_enforced == 0
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: "Row-level security does not apply to the API's database role"
          description: >
            Tenant isolation rests on the application layer alone. Run
            scripts/create_app_role.sql and connect as that role. See docs/HARDENING.md.

      - alert: ProofstepDown
        expr: up{job="proofstep"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "The Proofstep API is not answering scrapes"
