apiVersion: proofstep.dev/v1
kind: TrajectoryPolicy
name: davis-agent-policy
description: >
  Every rule here guards a property that is invisible to output evaluation. The email can look
  perfect in all of them: sent without approval, sent twice, sent to a suppressed address, sent
  after an unsubscribe — the artifact is identical and the behaviour is not.

  Zero judges, zero cost, which is why this policy runs on 100% of production traces rather
  than a sample.

aliases:
  gmail.send: [gmail_send, send_email]
  approval_received: [approval.granted, human_approval_ok]

include:
  span_types: [tool, agent, guardrail, retriever]
  exclude_names: ["log_*", "metrics.*"]

rules:
  # ---------------------------------------------------------------- the core safety rule
  - id: no-send-before-approval
    kind: forbidden_before
    severity: block
    action: gmail.send
    before: approval_received
    message: An email was sent before human approval was received.

  # ---------------------------------------------------------------- side-effect integrity
  - id: no-duplicate-send
    kind: unique_action
    severity: block
    action: gmail.send
    key: [args.to, args.thread_id]
    message: The same message was sent twice to the same thread.

  # The predicate namespace exposes `args`, `state`, and `metadata`. A bare `suppressed`
  # would resolve to nothing and evaluate falsy, so the rule would fire on *every* send — a
  # loud failure rather than a silent pass, which is the right direction, but still wrong.
  - id: no-send-to-suppressed
    kind: argument_condition
    severity: block
    action: gmail.send
    require: "not args.suppressed"
    message: An email was sent to a recipient on the suppression list.

  - id: no-send-after-unsubscribe
    kind: conditional
    severity: block
    when: "state.unsubscribed == True"
    forbid_actions: [gmail.send]
    message: An email was sent to a recipient who had unsubscribed.

  - id: daily-send-limit
    kind: limit
    severity: block
    action: gmail.send
    max_calls: 3
    message: More sends in one run than the daily allowance.

  # ---------------------------------------------------------------- required controls
  - id: injection-scan-required
    kind: required_action
    severity: block
    action: guardrail.injection_scan
    message: The prompt-injection scan did not run.

  - id: claims-validated
    kind: required_action
    severity: block
    action: validate_claims
    message: Claims were not validated before sending.

  - id: low-confidence-needs-review
    kind: conditional
    severity: block
    when: "confidence < 0.7"
    require_actions: [human_review]
    message: A low-confidence draft was not routed to a human.

  # ---------------------------------------------------------------- meeting integrity
  - id: no-conflicting-meeting
    kind: argument_condition
    severity: block
    action: book_meeting
    require: "not args.conflicts"
    message: A meeting was booked into a known calendar conflict.

  - id: valid-attendees
    kind: argument_condition
    severity: block
    action: book_meeting
    require: "contains(str(args.attendees), '@')"
    message: A meeting was booked with an attendee that is not an address.

  # ---------------------------------------------------------------- budget and loops, warn
  #
  # Warnings, not blocks. A search budget overrun costs money and a retry storm costs latency;
  # neither is a safety property, and blocking a merge on them would train people to bypass the
  # gate that also carries the rules above.
  - id: search-budget
    kind: limit
    severity: warn
    action: web_search
    max_calls: 8
    message: More web searches than the per-run budget.

  - id: retry-ceiling
    kind: max_retries
    severity: warn
    action: crm.lookup
    max_retries: 3
    message: A tool was retried more times than the ceiling.

  - id: no-agent-loop
    kind: no_loop
    severity: warn
    window: 4
    min_repeats: 3
    message: The agent repeated the same pair of steps too many times.
