apiVersion: evalforge.dev/v1
kind: EvalSuite
name: davis-email
description: >
  Email quality. Six of nine metrics are deterministic and cost nothing.

  Placeholder leakage — `[First Name]` reaching a prospect — is the single most embarrassing
  failure mode in outbound email, and it is a regex. Spending a judge on it would be absurd:
  slower, costlier, and less reliable than a pattern match. The judge is reserved for whether
  the personalisation is *grounded*, which cannot be pattern-matched.

dataset:
  path: ../fixtures/davis-email.jsonl

task:
  entrypoint: examples.davis_sdr.email:compose_email
  timeout_s: 30

execution:
  concurrency: 8
  judge_concurrency: 4
  seed: 42

evaluators:
  - name: valid_schema
    type: json_schema
    schema_path: ../schemas/davis-email.json

  # A regex, and blocking. Nothing else in this suite is as cheap or as important.
  - name: no_placeholders
    type: exact_match
    field: output.no_placeholders
    expected_field: no_placeholders

  - name: subject_length
    type: exact_match
    field: output.subject_length_ok
    expected_field: subject_length_ok

  - name: body_length
    type: exact_match
    field: output.body_length_ok
    expected_field: body_length_ok

  # A set subset check. Legal signs off on the approved list, not on the model.
  - name: approved_claim_compliance
    type: exact_match
    field: output.claims_approved
    expected_field: claims_approved

  - name: grounded_personalization
    type: llm_judge
    model: claude-sonnet-5
    rubric_path: ../rubrics/grounded-personalization.md
    scale: {min: 1, max: 5, normalize: true}
    # The body and the evidence it should be grounded in. Not the expected output.
    inputs: [output.body, output.evidence_text]
    temperature: 0.0
    seed: 42
    calibration:
      dataset: ../calibration/grounded-personalization.jsonl
      passing_labels: ["4", "5"]
      # Exact agreement is the wrong statistic to threshold on an ordinal scale: it penalises a
      # 4-vs-5 disagreement exactly as much as 1-vs-5. Weighted kappa is distance-aware and is
      # what the real bar is set on here; the agreement floor is kept low deliberately so it
      # catches a judge that has stopped answering rather than one that is a point off.
      min_agreement: 0.35
      min_kappa: 0.6
      # 20, not the default 50. On a 1-5 scale the default would demand 250 labels; weighted
      # kappa measures distance on the scale rather than per-class recall, so it already accounts
      # for near misses and the extra 130 annotations sharpen little. The floor still guards
      # against a rubric point being entirely unmeasured, which is what it is for.
      min_per_class: 20

  - name: ops
    type: operational
    percentiles: [50, 95]

gates:
  valid_schema:
    minimum: 1.0
    blocking: true

  no_placeholders:
    minimum: 1.0
    blocking: true

  approved_claim_compliance:
    minimum: 1.0
    blocking: true

  subject_length:
    minimum: 0.95

  body_length:
    minimum: 0.95

  grounded_personalization:
    minimum: 0.70
    max_regression: 0.05

  # A judge that costs more than the task it evaluates should be a visible fact.
  cost_per_example:
    maximum: 0.02
    blocking: false

  p95_latency_ms:
    maximum: 5000
    blocking: false

calibration:
  directory: ../calibration
  require: true

baseline:
  strategy: latest_on_branch
  branch: main

report:
  formats: [terminal, json]
  output: evalforge-davis-email.json
