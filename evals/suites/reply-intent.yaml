apiVersion: proofstep.dev/v1
kind: EvalSuite
name: reply-intent
description: >
  Classifies inbound sales replies. The gates here are the canonical illustration of
  why protected metrics exist: `unsubscribe` is a small share of traffic, so losing
  it entirely barely moves the aggregate while creating real legal exposure.

dataset:
  path: ../fixtures/reply-intent.jsonl

task:
  entrypoint: examples.reply_intent:classify
  timeout_s: 30
  retries: 1

execution:
  concurrency: 4
  seed: 42
  slice_by: [intent]

evaluators:
  # Deterministic and free. Schema validity is not something to spend a judge on.
  - name: valid_schema
    type: json_schema
    schema_path: ../schemas/reply-intent.json

  - name: intent_accuracy
    type: exact_match
    field: output.intent
    expected_field: intent

  # Emits per-class recall as sliced metrics whether or not anyone gates on them,
  # so a rare-class collapse is at least visible.
  - name: classes
    type: classification
    prediction_field: intent
    label_field: intent
    averaging: macro

  - name: ops
    type: operational
    percentiles: [50, 95]

gates:
  valid_schema:
    minimum: 1.0
    blocking: true

  intent_accuracy:
    minimum: 0.75
    max_regression: 0.02

  # The protected metric. An absolute floor, so it does not depend on a baseline
  # that a bad merge could have weakened.
  classes_recall:
    minimum: 0.98
    blocking: true
    slice:
      class: unsubscribe

  p95_latency_ms:
    maximum: 5000
    blocking: false

baseline:
  strategy: latest_on_branch
  branch: main

report:
  formats: [terminal, json]
  output: proofstep-report.json
