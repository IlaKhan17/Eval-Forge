[project]
name = "proofstep-api"
version = "0.1.0.dev0"
description = "Proofstep API and worker — ingestion, control plane, background jobs"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "proofstep-types",
    "proofstep-core",
    "proofstep-trajectory",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # `[email]` for EmailStr: sign-up and invitations validate addresses, and a hand-rolled regex
    # for email is a well-known way to reject valid addresses while accepting invalid ones.
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary,pool]>=3.2",
    "redis>=5.2",
    "arq>=0.26",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "boto3>=1.35",
    "python-multipart>=0.0.20",
    "opentelemetry-proto>=1.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proofstep_api"]

[tool.uv.sources]
proofstep-types = { workspace = true }
proofstep-core = { workspace = true }
proofstep-trajectory = { workspace = true }
