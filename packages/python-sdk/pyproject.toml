[project]
name = "evalforge"
version = "0.1.0.dev0"
description = "EvalForge Python SDK — tracing and evaluation for AI applications and agents"
readme = "README.md"
# Deliberately wider than the rest of the workspace: this installs into *users'*
# applications, and forcing an interpreter upgrade to adopt a tracing library
# is a non-starter. See ADR-002.
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "evalforge-types",
    "httpx>=0.27",
    "pydantic>=2.9",
]

[project.optional-dependencies]
eval = ["evalforge-core", "evalforge-trajectory"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalforge"]

[tool.uv.sources]
evalforge-types = { workspace = true }
evalforge-core = { workspace = true }
evalforge-trajectory = { workspace = true }
