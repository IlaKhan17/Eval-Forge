[project]
name = "evalforge-core"
version = "0.1.0.dev0"
description = "EvalForge evaluation engine — datasets, evaluators, runner, aggregation, gates"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "evalforge-types",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalforge_core"]

[tool.uv.sources]
evalforge-types = { workspace = true }
