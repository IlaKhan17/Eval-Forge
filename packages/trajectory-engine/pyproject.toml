[project]
name = "evalforge-trajectory"
version = "0.1.0.dev0"
description = "EvalForge trajectory policy engine — policy-as-code for tool-using agents"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "evalforge-types",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalforge_trajectory"]

[tool.uv.sources]
evalforge-types = { workspace = true }
