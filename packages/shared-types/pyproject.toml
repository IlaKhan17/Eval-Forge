[project]
name = "evalforge-types"
version = "0.1.0.dev0"
description = "Shared Pydantic models for EvalForge — the wire and domain contract"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalforge_types"]
